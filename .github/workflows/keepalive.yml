# Keeps the free Supabase project awake and this workflow enabled.
# - Supabase pauses free projects after 7 days without database activity. This
#   queries the database twice a day (only the public anon key is used).
# - GitHub disables scheduled workflows after 60 days without repository activity.
#   The second step re-enables this workflow through the API on every run, so the
#   schedule keeps going without needing commits.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '47 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          set -a; . ./.env.production; set +a
          for i in 1 2 3; do
            curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer. The project may be paused: open supabase.com and click Restore."
          exit 1
      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
