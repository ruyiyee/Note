# Supabase pauses free projects after 7 days without activity. This pings the
# database once a day so the project stays awake. Uses only the public anon key.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
